# Optional display package for a MAX7219 directly wired to Voice PE.
substitutions:
  max7219_din_pin: GPIO41
  max7219_clk_pin: GPIO40
  max7219_cs_pin: GPIO42
  max7219_num_chips: "3"

esphome:
  on_boot:
    - priority: -100
      then:
        - lambda: |-
            id(max7219_matrix).intensity(static_cast<int>(id(max7219_brightness).state));
        - if:
            condition:
              switch.is_on: max7219_enabled
            then:
              - script.execute: max7219_test

switch:
  - platform: template
    id: max7219_enabled
    name: "Экран часов"
    icon: mdi:monitor
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    turn_on_action:
      - lambda: |-
          id(max7219_matrix).intensity(static_cast<int>(id(max7219_brightness).state));
          id(max7219_matrix).turn_on_off(true);
      - component.update: max7219_matrix
    turn_off_action:
      - script.stop: max7219_test
      - lambda: |-
          id(max7219_test_active) = false;
          id(max7219_matrix).turn_on_off(false);
      - component.update: max7219_matrix

api:
  actions:
    - action: matrix_show
      description: "Показать текст или иконку на матрице, затем вернуть часы/таймер"
      variables:
        message:
          type: string
          description: "Текст (латиница/кириллица); пустая строка для иконки"
        icon:
          type: string
          description: "smile, sad, heart, check, cross, bell; пустая строка для текста"
        duration:
          type: int
          description: "Длительность в секундах (1–3600); 0 — вернуть часы"
      then:
        - lambda: |-
            const std::string content(message.c_str());
            std::string symbol(icon.c_str());
            if (symbol == "none" || symbol == "None") symbol.clear();
            if (duration <= 0 || (content.empty() && symbol.empty())) {
              id(max7219_overlay_duration) = 0;
              id(max7219_overlay_columns).clear();
              return;
            }
            std::vector<uint8_t> columns;
            if (!symbol.empty()) {
              const uint8_t *rows = nullptr;
              static const uint8_t smile[] = {0x3c,0x42,0xa5,0x81,0xa5,0x99,0x42,0x3c};
              static const uint8_t sad[] = {0x3c,0x42,0xa5,0x81,0x99,0xa5,0x42,0x3c};
              static const uint8_t heart[] = {0x00,0x66,0xff,0xff,0x7e,0x3c,0x18,0x00};
              static const uint8_t check[] = {0x00,0x01,0x03,0x86,0xcc,0x78,0x30,0x00};
              static const uint8_t cross[] = {0x81,0x42,0x24,0x18,0x18,0x24,0x42,0x81};
              static const uint8_t bell[] = {0x18,0x3c,0x3c,0x3c,0x7e,0x7e,0x00,0x18};
              if (symbol == "smile" || symbol == "🙂" || symbol == "😊") rows = smile;
              else if (symbol == "sad" || symbol == "🙁") rows = sad;
              else if (symbol == "heart" || symbol == "❤" || symbol == "❤️") rows = heart;
              else if (symbol == "check" || symbol == "✅") rows = check;
              else if (symbol == "cross" || symbol == "❌") rows = cross;
              else if (symbol == "bell" || symbol == "🔔") rows = bell;
              else { ESP_LOGW("matrix", "Unknown icon; use smile, sad, heart, check, cross or bell"); return; }
              for (int x = 0; x < 8; ++x) {
                uint8_t column = 0;
                for (int y = 0; y < 8; ++y) if (rows[y] & (1 << (7-x))) column |= 1 << y;
                columns.push_back(column);
              }
            } else columns = id(max7219_text_columns)(content);
            id(max7219_overlay_columns) = std::move(columns);
            id(max7219_overlay_icon) = !symbol.empty();
            id(max7219_overlay_started) = millis();
            id(max7219_overlay_duration) = static_cast<uint32_t>(std::min<int32_t>(duration, 3600)) * 1000;
        - component.update: max7219_matrix

globals:
  - id: max7219_text_columns
    type: std::function<std::vector<uint8_t>(const std::string &)>
    initial_value: |-
      [](const std::string &text) -> std::vector<uint8_t> {
        std::vector<uint8_t> columns;
        size_t offset = 0, count = 0;
        while (offset < text.size() && count++ < 64) {
          uint32_t cp = static_cast<uint8_t>(text[offset++]);
          int extra = 0;
          if (cp >= 0xc0 && cp < 0xe0) { cp &= 31; extra = 1; }
          else if (cp >= 0xe0 && cp < 0xf0) { cp &= 15; extra = 2; }
          else if (cp >= 0xf0) { cp &= 7; extra = 3; }
          for (int n = 0; n < extra; ++n) {
            if (offset >= text.size() || (static_cast<uint8_t>(text[offset]) & 0xc0) != 0x80) return columns;
            cp = (cp << 6) | (static_cast<uint8_t>(text[offset++]) & 63);
          }
          if (cp >= 'a' && cp <= 'z') cp -= 32;
          if (cp >= 0x430 && cp <= 0x44f) cp -= 32;
          if (cp == 0x451) cp = 0x401;
          uint8_t rows[5] = {6,1,2,0,2};
          switch (cp) {
            case 48: rows[0]=7; rows[1]=5; rows[2]=5; rows[3]=5; rows[4]=7; break;
            case 49: rows[0]=2; rows[1]=2; rows[2]=2; rows[3]=2; rows[4]=2; break;
            case 50: rows[0]=7; rows[1]=1; rows[2]=7; rows[3]=4; rows[4]=7; break;
            case 51: rows[0]=7; rows[1]=1; rows[2]=7; rows[3]=1; rows[4]=7; break;
            case 52: rows[0]=5; rows[1]=5; rows[2]=7; rows[3]=1; rows[4]=1; break;
            case 53: rows[0]=7; rows[1]=4; rows[2]=7; rows[3]=1; rows[4]=7; break;
            case 54: rows[0]=7; rows[1]=4; rows[2]=7; rows[3]=5; rows[4]=7; break;
            case 55: rows[0]=7; rows[1]=1; rows[2]=1; rows[3]=1; rows[4]=1; break;
            case 56: rows[0]=7; rows[1]=5; rows[2]=7; rows[3]=5; rows[4]=7; break;
            case 57: rows[0]=7; rows[1]=5; rows[2]=7; rows[3]=1; rows[4]=7; break;
            case 65: rows[0]=2; rows[1]=5; rows[2]=7; rows[3]=5; rows[4]=5; break;
            case 66: rows[0]=6; rows[1]=5; rows[2]=6; rows[3]=5; rows[4]=6; break;
            case 67: rows[0]=7; rows[1]=4; rows[2]=4; rows[3]=4; rows[4]=7; break;
            case 68: rows[0]=6; rows[1]=5; rows[2]=5; rows[3]=5; rows[4]=6; break;
            case 69: rows[0]=7; rows[1]=4; rows[2]=6; rows[3]=4; rows[4]=7; break;
            case 70: rows[0]=7; rows[1]=4; rows[2]=6; rows[3]=4; rows[4]=4; break;
            case 71: rows[0]=7; rows[1]=4; rows[2]=5; rows[3]=5; rows[4]=7; break;
            case 72: rows[0]=5; rows[1]=5; rows[2]=7; rows[3]=5; rows[4]=5; break;
            case 73: rows[0]=7; rows[1]=2; rows[2]=2; rows[3]=2; rows[4]=7; break;
            case 74: rows[0]=1; rows[1]=1; rows[2]=1; rows[3]=5; rows[4]=7; break;
            case 75: rows[0]=5; rows[1]=5; rows[2]=6; rows[3]=5; rows[4]=5; break;
            case 76: rows[0]=4; rows[1]=4; rows[2]=4; rows[3]=4; rows[4]=7; break;
            case 77: rows[0]=5; rows[1]=7; rows[2]=7; rows[3]=5; rows[4]=5; break;
            case 78: rows[0]=5; rows[1]=7; rows[2]=7; rows[3]=7; rows[4]=5; break;
            case 79: rows[0]=7; rows[1]=5; rows[2]=5; rows[3]=5; rows[4]=7; break;
            case 80: rows[0]=6; rows[1]=5; rows[2]=6; rows[3]=4; rows[4]=4; break;
            case 81: rows[0]=7; rows[1]=5; rows[2]=5; rows[3]=7; rows[4]=1; break;
            case 82: rows[0]=6; rows[1]=5; rows[2]=6; rows[3]=5; rows[4]=5; break;
            case 83: rows[0]=7; rows[1]=4; rows[2]=7; rows[3]=1; rows[4]=7; break;
            case 84: rows[0]=7; rows[1]=2; rows[2]=2; rows[3]=2; rows[4]=2; break;
            case 85: rows[0]=5; rows[1]=5; rows[2]=5; rows[3]=5; rows[4]=7; break;
            case 86: rows[0]=5; rows[1]=5; rows[2]=5; rows[3]=5; rows[4]=2; break;
            case 87: rows[0]=5; rows[1]=5; rows[2]=7; rows[3]=7; rows[4]=5; break;
            case 88: rows[0]=5; rows[1]=5; rows[2]=2; rows[3]=5; rows[4]=5; break;
            case 89: rows[0]=5; rows[1]=5; rows[2]=2; rows[3]=2; rows[4]=2; break;
            case 90: rows[0]=7; rows[1]=1; rows[2]=2; rows[3]=4; rows[4]=7; break;
            case 32: rows[0]=0; rows[1]=0; rows[2]=0; rows[3]=0; rows[4]=0; break;
            case 33: rows[0]=2; rows[1]=2; rows[2]=2; rows[3]=0; rows[4]=2; break;
            case 63: rows[0]=6; rows[1]=1; rows[2]=2; rows[3]=0; rows[4]=2; break;
            case 58: rows[0]=0; rows[1]=2; rows[2]=0; rows[3]=2; rows[4]=0; break;
            case 46: rows[0]=0; rows[1]=0; rows[2]=0; rows[3]=0; rows[4]=2; break;
            case 45: rows[0]=0; rows[1]=0; rows[2]=7; rows[3]=0; rows[4]=0; break;
            case 43: rows[0]=0; rows[1]=2; rows[2]=7; rows[3]=2; rows[4]=0; break;
            case 47: rows[0]=1; rows[1]=1; rows[2]=2; rows[3]=4; rows[4]=4; break;
            case 37: rows[0]=5; rows[1]=1; rows[2]=2; rows[3]=4; rows[4]=5; break;
            case 1041: rows[0]=7; rows[1]=4; rows[2]=7; rows[3]=5; rows[4]=7; break;
            case 1043: rows[0]=7; rows[1]=4; rows[2]=4; rows[3]=4; rows[4]=4; break;
            case 1044: rows[0]=2; rows[1]=5; rows[2]=5; rows[3]=7; rows[4]=5; break;
            case 1046: rows[0]=5; rows[1]=7; rows[2]=2; rows[3]=7; rows[4]=5; break;
            case 1047: rows[0]=6; rows[1]=1; rows[2]=2; rows[3]=1; rows[4]=6; break;
            case 1048: rows[0]=5; rows[1]=5; rows[2]=7; rows[3]=5; rows[4]=5; break;
            case 1049: rows[0]=2; rows[1]=5; rows[2]=7; rows[3]=5; rows[4]=5; break;
            case 1051: rows[0]=3; rows[1]=5; rows[2]=5; rows[3]=5; rows[4]=5; break;
            case 1055: rows[0]=7; rows[1]=5; rows[2]=5; rows[3]=5; rows[4]=5; break;
            case 1059: rows[0]=5; rows[1]=5; rows[2]=7; rows[3]=1; rows[4]=6; break;
            case 1060: rows[0]=2; rows[1]=7; rows[2]=7; rows[3]=7; rows[4]=2; break;
            case 1062: rows[0]=5; rows[1]=5; rows[2]=5; rows[3]=7; rows[4]=1; break;
            case 1063: rows[0]=5; rows[1]=5; rows[2]=7; rows[3]=1; rows[4]=1; break;
            case 1064: rows[0]=5; rows[1]=5; rows[2]=7; rows[3]=7; rows[4]=7; break;
            case 1065: rows[0]=5; rows[1]=5; rows[2]=7; rows[3]=7; rows[4]=1; break;
            case 1066: rows[0]=6; rows[1]=2; rows[2]=3; rows[3]=3; rows[4]=3; break;
            case 1067: rows[0]=5; rows[1]=5; rows[2]=7; rows[3]=7; rows[4]=7; break;
            case 1068: rows[0]=4; rows[1]=4; rows[2]=6; rows[3]=5; rows[4]=6; break;
            case 1069: rows[0]=6; rows[1]=1; rows[2]=3; rows[3]=1; rows[4]=6; break;
            case 1070: rows[0]=5; rows[1]=7; rows[2]=7; rows[3]=7; rows[4]=5; break;
            case 1071: rows[0]=7; rows[1]=5; rows[2]=7; rows[3]=3; rows[4]=5; break;
            case 1040: rows[0]=2; rows[1]=5; rows[2]=7; rows[3]=5; rows[4]=5; break;
            case 1042: rows[0]=6; rows[1]=5; rows[2]=6; rows[3]=5; rows[4]=6; break;
            case 1045: rows[0]=7; rows[1]=4; rows[2]=6; rows[3]=4; rows[4]=7; break;
            case 1050: rows[0]=5; rows[1]=5; rows[2]=6; rows[3]=5; rows[4]=5; break;
            case 1052: rows[0]=5; rows[1]=7; rows[2]=7; rows[3]=5; rows[4]=5; break;
            case 1053: rows[0]=5; rows[1]=5; rows[2]=7; rows[3]=5; rows[4]=5; break;
            case 1054: rows[0]=7; rows[1]=5; rows[2]=5; rows[3]=5; rows[4]=7; break;
            case 1056: rows[0]=6; rows[1]=5; rows[2]=6; rows[3]=4; rows[4]=4; break;
            case 1057: rows[0]=7; rows[1]=4; rows[2]=4; rows[3]=4; rows[4]=7; break;
            case 1058: rows[0]=7; rows[1]=2; rows[2]=2; rows[3]=2; rows[4]=2; break;
            case 1061: rows[0]=5; rows[1]=5; rows[2]=2; rows[3]=5; rows[4]=5; break;
            case 1025: rows[0]=7; rows[1]=4; rows[2]=6; rows[3]=4; rows[4]=7; break;
          }
          if (!columns.empty()) columns.push_back(0);
          for (int x = 0; x < 3; ++x) {
            uint8_t column = 0;
            for (int y = 0; y < 5; ++y) if (rows[y] & (1 << (2-x))) column |= 1 << y;
            columns.push_back(column);
          }
        }
        return columns;
      }
  - id: max7219_overlay_columns
    type: std::vector<uint8_t>
  - id: max7219_overlay_started
    type: uint32_t
    initial_value: '0'
  - id: max7219_overlay_duration
    type: uint32_t
    initial_value: '0'
  - id: max7219_overlay_icon
    type: bool
    initial_value: 'false'
  - id: max7219_test_active
    type: bool
    initial_value: 'false'

script:
  - id: max7219_test
    mode: restart
    then:
      - lambda: |-
          id(max7219_test_active) = true;
          id(max7219_matrix).intensity(3);
      - component.update: max7219_matrix
      - delay: 2s
      - lambda: |-
          id(max7219_test_active) = false;
          id(max7219_matrix).intensity(static_cast<int>(id(max7219_brightness).state));
      - component.update: max7219_matrix

button:
  - platform: template
    name: "Проверка матрицы"
    icon: mdi:led-on
    on_press:
      - script.execute: max7219_test

number:
  - platform: template
    name: "Яркость часов"
    id: max7219_brightness
    icon: mdi:brightness-6
    min_value: 0
    max_value: 15
    step: 1
    initial_value: 3
    restore_value: true
    optimistic: true
    set_action:
      - lambda: |-
          id(max7219_matrix).intensity(static_cast<int>(x));
          id(max7219_matrix).update();

text_sensor:
  - platform: homeassistant
    id: max7219_ha_time
    entity_id: sensor.time
    internal: true
    on_value:
      - component.update: max7219_matrix

spi:
  - id: max7219_spi
    clk_pin: ${max7219_clk_pin}
    mosi_pin: ${max7219_din_pin}

display:
  - platform: max7219digit
    id: max7219_matrix
    spi_id: max7219_spi
    cs_pin: ${max7219_cs_pin}
    num_chips: ${max7219_num_chips}
    intensity: 3
    scroll_enable: false
    update_interval: 250ms
    lambda: |-
      it.clear();
      if (!id(max7219_enabled).state) return;
      if (id(max7219_test_active)) {
        for (int y = 0; y < it.get_height(); ++y) {
          for (int x = 0; x < it.get_width(); ++x) {
            it.draw_pixel_at(x, y, Color::WHITE);
          }
        }
        return;
      }

      if (id(max7219_overlay_duration) > 0) {
        const uint32_t elapsed = millis() - id(max7219_overlay_started);
        if (elapsed < id(max7219_overlay_duration)) {
          const auto &columns = id(max7219_overlay_columns);
          const int length = static_cast<int>(columns.size());
          const int width = it.get_width();
          const int y_offset = id(max7219_overlay_icon) ? 0 : 2;
          const int start_x = length <= width ? (width - length) / 2 :
                              -static_cast<int>((elapsed / 160) % (length + width));
          for (int copy = 0; copy < (length > width ? 2 : 1); ++copy) {
            for (int col = 0; col < length; ++col) {
              const int x = start_x + col + copy * (length + width);
              if (x < 0 || x >= width) continue;
              for (int y = 0; y < (id(max7219_overlay_icon) ? 8 : 5); ++y) {
                if (columns[col] & (1 << y)) it.draw_pixel_at(x, y + y_offset, Color::WHITE);
              }
            }
          }
          return;
        }
        id(max7219_overlay_duration) = 0;
        id(max7219_overlay_columns).clear();
      }

      // Compact 16x8 layout: four 3x5 digits and ONE two-dot colon.
      if (it.get_width() == 16) {
        int left = 0, right = 0;
        bool valid = false, timer_mode = false, long_timer = false;
        if (id(dialog_timer_active)) {
          int64_t remaining = id(dialog_timer_remaining);
          if (!id(dialog_timer_paused)) {
            remaining -= (millis() - id(dialog_timer_received_at)) / 1000;
          }
          long_timer = remaining >= 3600;
          if (remaining > 0 && remaining < 3600) {
            valid = timer_mode = true;
            left = remaining / 60;
            right = remaining % 60;
          }
        }
        if (!timer_mode && id(max7219_ha_time).has_state()) {
          const auto &clock = id(max7219_ha_time).state;
          if (clock.size() == 5 && clock[2] == ':' &&
              clock[0] >= '0' && clock[0] <= '9' &&
              clock[1] >= '0' && clock[1] <= '9' &&
              clock[3] >= '0' && clock[3] <= '9' &&
              clock[4] >= '0' && clock[4] <= '9') {
            left = (clock[0] - '0') * 10 + clock[1] - '0';
            right = (clock[3] - '0') * 10 + clock[4] - '0';
            valid = left < 24 && right < 60;
          }
        }
        const uint8_t digits[10][5] = {
          {7,5,5,5,7}, {2,2,2,2,2}, {7,1,7,4,7}, {7,1,7,1,7},
          {5,5,7,1,1}, {7,4,7,1,7}, {7,4,7,5,7}, {7,1,1,1,1},
          {7,5,7,5,7}, {7,5,7,1,7}
        };
        const int positions[] = {0, 4, 9, 13};
        const int values[] = {left / 10, left % 10, right / 10, right % 10};
        for (int n = 0; n < 4; ++n) {
          for (int y = 0; y < 5; ++y) {
            const uint8_t row = valid ? digits[values[n]][y] : (y == 2 ? 7 : 0);
            for (int col = 0; col < 3; ++col) {
              if (row & (1 << (2 - col))) {
                const int digit_offset = (n <= 1 && values[n] == 1) ? 1 : 0;
                it.draw_pixel_at(positions[n] + col + digit_offset, y + 2, Color::WHITE);
              }
            }
          }
        }
        it.draw_pixel_at(8, 3, Color::WHITE);
        it.draw_pixel_at(8, 5, Color::WHITE);
        if (!timer_mode && (id(dialog_alarm_active) || long_timer)) it.draw_pixel_at(0, 1, Color::WHITE);
        return;
      }

      std::string text = "";
      bool showing_timer = false;
      bool long_timer = false;

      // 1. ВЫЧИСЛЕНИЕ ОБРАТНОГО ОТСЧЁТА
      if (id(dialog_timer_active)) {
        int64_t remaining = id(dialog_timer_remaining);

        if (!id(dialog_timer_paused)) {
          uint32_t elapsed =
            (millis() - id(dialog_timer_received_at)) / 1000;

          remaining -= elapsed;
        }

        long_timer = remaining >= 3600;
        if (remaining > 0 && remaining < 3600) {
          showing_timer = true;

          int minutes = remaining / 60;
          int seconds = remaining % 60;

          char buffer[16];

          snprintf(
            buffer,
            sizeof(buffer),
            "%d:%02d",
            minutes,
            seconds
          );

          text = buffer;
        }
      }

      // 2. ЕСЛИ ТАЙМЕРА НЕТ, ПОКАЗЫВАЕМ ЧАСЫ
      if (!showing_timer && id(max7219_ha_time).has_state() &&
          id(max7219_ha_time).state != "unknown" &&
          id(max7219_ha_time).state != "unavailable") {
        text = id(max7219_ha_time).state;
      }

      if (text.empty()) {
        // No HA time or timer yet: show --:-- rather than a blank screen.
        for (int x : {0, 6, 14, 20}) {
          for (int col = 0; col < 4; ++col) {
            it.draw_pixel_at(x + col, 4, Color::WHITE);
          }
        }
        it.draw_pixel_at(11, 3, Color::WHITE);
        it.draw_pixel_at(11, 6, Color::WHITE);
        if (id(dialog_alarm_active) || long_timer) it.draw_pixel_at(0, 0, Color::WHITE);
        return;
      }

      // Формат M:SS -> 0M:SS
      if (showing_timer &&
          text.size() == 4 &&
          text[1] == ':') {
        text = "0" + text;
      }

      // Проверяем двоеточие и цифры
      size_t colon = text.find(':');

      if (colon == std::string::npos ||
          text.size() - colon - 1 != 2) {
        return;
      }

      for (size_t i = 0; i < text.size(); i++) {
        if (i == colon) continue;
        if (text[i] < '0' || text[i] > '9') {
          return;
        }
      }

      // 3. КРУПНЫЙ ШРИФТ 4x7
      const uint8_t font4[10][7] = {
        {15,9,9,9,9,9,15},     // 0
        {2,6,2,2,2,2,7},      // 1
        {15,1,1,15,8,8,15},   // 2
        {15,1,1,7,1,1,15},    // 3
        {9,9,9,15,1,1,1},     // 4
        {15,8,8,15,1,1,15},   // 5
        {15,8,8,15,9,9,15},   // 6
        {15,1,1,2,2,4,4},     // 7
        {15,9,9,15,9,9,15},   // 8
        {15,9,9,15,1,1,15}   // 9
      };

      // 4. КОМПАКТНЫЙ ШРИФТ 3x7
      const uint8_t font3[10][7] = {
        {7,5,5,5,5,5,7},      // 0
        {2,6,2,2,2,2,7},      // 1
        {7,1,1,7,4,4,7},      // 2
        {7,1,1,3,1,1,7},      // 3
        {5,5,5,7,1,1,1},      // 4
        {7,4,4,7,1,1,7},      // 5
        {7,4,4,7,5,5,7},      // 6
        {7,1,1,2,2,2,2},      // 7
        {7,5,5,7,5,5,7},      // 8
        {7,5,5,7,1,1,7}      // 9
      };

      auto draw_digit4 = [&](int x, char ch) {
        int n = ch - '0';

        for (int y = 0; y < 7; y++) {
          for (int col = 0; col < 4; col++) {
            if (font4[n][y] & (1 << (3-col))) {
              it.draw_pixel_at(
                x + col, y + 1, Color::WHITE
              );
            }
          }
        }
      };

      auto draw_digit3 = [&](int x, char ch) {
        int n = ch - '0';

        for (int y = 0; y < 7; y++) {
          for (int col = 0; col < 3; col++) {
            if (font3[n][y] & (1 << (2-col))) {
              it.draw_pixel_at(
                x + col, y + 1, Color::WHITE
              );
            }
          }
        }
      };

      // 5. ВЫБИРАЕМ РАЗМЕР ЦИФР
      if (text.size() == 5 && colon == 2) {
        // HH:MM или MM:SS (до 99 минут)
        // Полная ширина 24 пикселя

        draw_digit4(0, text[0]);
        draw_digit4(6, text[1]);
        draw_digit4(14, text[3]);
        draw_digit4(20, text[4]);

        it.draw_pixel_at(11, 3, Color::WHITE);
        it.draw_pixel_at(11, 6, Color::WHITE);

      } else if (text.size() == 6 && colon == 3) {
        // MMM:SS (100-999 минут)
        // Компактный шрифт 3x7

        draw_digit3(0, text[0]);
        draw_digit3(4, text[1]);
        draw_digit3(8, text[2]);

        // Двоеточие
        it.draw_pixel_at(12, 3, Color::WHITE);
        it.draw_pixel_at(12, 6, Color::WHITE);

        draw_digit3(14, text[4]);
        draw_digit3(18, text[5]);

      } else if (text.size() == 7 && colon == 4) {
        // MMMM:SS (1000-9999 минут)
        // Узкие цифры 3x7 без промежутков

        draw_digit3(0, text[0]);
        draw_digit3(3, text[1]);
        draw_digit3(6, text[2]);
        draw_digit3(9, text[3]);

        it.draw_pixel_at(13, 3, Color::WHITE);
        it.draw_pixel_at(13, 6, Color::WHITE);

        draw_digit3(15, text[5]);
        draw_digit3(19, text[6]);
      }

      // 6. ИНДИКАТОР БУДИЛЬНИКА
      // Точка в левом верхнем углу
      // Только в режиме часов
      if (!showing_timer && (id(dialog_alarm_active) || long_timer)) {
        it.draw_pixel_at(0, 0, Color::WHITE);
      }
